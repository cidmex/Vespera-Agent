[workspace]
resolver = "3"
members = [".", "crates/vespera-proto"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
repository = "https://github.com/cidmex/Vespera-Agent"

[package]
name = "vespera-agent"
description = "Lightweight Linux monitoring agent for Vespera"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
vespera-proto = { path = "crates/vespera-proto" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "io-util", "process", "fs", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
regex-lite = "0.1"
fastrand = "2"
libc = "0.2"
sha2 = "0.10"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
surge-ping = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
